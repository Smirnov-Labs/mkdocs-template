# mkdocs.yml — customize the placeholders below for your project.
# Required edits: site_name, site_description, repo_name, repo_url, nav.
# Optional edits: theme palette, social links, extra_css.

site_name: Project Name — Documentation
site_description: One-sentence description of what this system does.
site_author: Team Name
# site_url: https://example.com

# Uncomment when you have a repo:
# repo_name: org/repo-name
# repo_url: https://github.com/org/repo-name

docs_dir: content
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  # Replace with your project logo (place files in content/assets/)
  # logo: assets/logo.svg
  # favicon: assets/logo.svg

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags
  - print-site:
      add_print_site_banner: false
      print_site_banner_template: null
      enumerate_headings: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  generator: false
  # social:
  #   - icon: fontawesome/brands/github
  #     link: https://github.com/your-org

extra_css:
  - stylesheets/extra.css

# Customize this nav tree for your project. The four sections below match the
# baseline structure used by the docx export script's --list output. Add, remove,
# or rename entries as needed.
nav:
  - Overview: index.md

  - Functional Specification:
      - functional-specification/index.md

  - User Journey Planning:
      - user-journey-planning/index.md

  - Technical Specification:
      - technical-specification/index.md

  - Project Management:
      - project-management/index.md
